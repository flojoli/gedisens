[project]
name = "gedisens"
version = "0.2.0"
description = "Compare vertical forest structure derived from ALS and GEDI LiDAR data."
authors = [{ name = "Florian Lippl" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["GEDI", "LiDAR", "ALS", "forest structure", "remote sensing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "geopandas>=1.0",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
h5 = ["h5py>=3.8"]

[project.scripts]
gedisens = "gedisens.cli:main"

[tool.poetry]
packages = [{ include = "gedisens", from = "src" }]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
